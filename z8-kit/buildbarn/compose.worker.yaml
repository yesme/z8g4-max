services:
  scheduler:
    image: ghcr.io/buildbarn/bb-scheduler:20261102T094740Z-c9ba98c
    command: ["/config/shared-scheduler.jsonnet"]
    volumes:
      - .:/config:ro
  runner-installer:
    image: ghcr.io/buildbarn/bb-runner-installer:20261102T094740Z-c9ba98c
    volumes:
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/runner-bin:/bb
  runner:
    image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:dd7654ffb01d5b7b54b23b9ce928a1f7f2d08c7b3d7e320b6574b55d7ccde78b
    command: ["/bb/bb_runner", "/config/shared-runner.jsonnet"]
    network_mode: none
    cpus: 12
    mem_limit: 32g
    volumes:
      - .:/config:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/runner-bin:/bb:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/worker:/worker
    depends_on:
      runner-installer:
        condition: service_completed_successfully
  worker:
    image: ghcr.io/buildbarn/bb-worker:20261102T094740Z-c9ba98c
    command: ["/config/shared-worker.jsonnet"]
    volumes:
      - .:/config:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/worker:/worker
    depends_on:
      - scheduler
      - runner
