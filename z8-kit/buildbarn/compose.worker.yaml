services:
  scheduler:
    image: z8/bb-scheduler:c9ba98c-command-platform
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    command: ["/config/shared-scheduler.jsonnet"]
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - .:/config:ro
  runner-installer:
    image: ghcr.io/buildbarn/bb-runner-installer:20261102T094740Z-c9ba98c@sha256:3242e966d6de8a8d514db34e9e741b08f242200f23ad6094295915906acc26d5
    volumes:
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/runner-bin:/bb
  runner:
    image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:dd7654ffb01d5b7b54b23b9ce928a1f7f2d08c7b3d7e320b6574b55d7ccde78b
    command: ["sh", "-ceu", "rm -f /run/bb-runner/runner.sock; exec /bb/bb_runner /config/shared-runner.jsonnet"]
    network_mode: none
    cpus: 72
    mem_limit: 512g
    memswap_limit: 512g
    volumes:
      - .:/config:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/runner-bin:/bb:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/worker:/worker
      - type: bind
        source: /run/z8-bb-runner
        target: /run/bb-runner
        bind:
          create_host_path: false
    depends_on:
      runner-installer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/bb-runner/runner.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
  worker:
    image: ghcr.io/buildbarn/bb-worker:20261102T094740Z-c9ba98c@sha256:ba07db89d5cd6ae750497a38037abe127426c771a55c8a3da48c4205b929a32a
    command: ["/config/shared-worker.jsonnet"]
    volumes:
      - .:/config:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/tiered}/worker:/worker
      - type: bind
        source: /run/z8-bb-runner
        target: /run/bb-runner
        bind:
          create_host_path: false
    depends_on:
      scheduler:
        condition: service_started
      runner:
        condition: service_healthy
