services:
  cache:
    image: ghcr.io/buildbarn/bb-storage:20261102T091443Z-ca3d8b4
    command: ["/config/cache.jsonnet"]
    ports:
      - "127.0.0.1:8980:8980"
    volumes:
      - ./cache.jsonnet:/config/cache.jsonnet:ro
      - ${BB_DATA_DIR:-/srv/buildbarn/cache}:/store
    restart: unless-stopped
