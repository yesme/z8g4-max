services:
  cache:
    image: z8/bb-storage:ca3d8b4-sequential-fill
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.storage
    command: ["/config/tiered-cache.jsonnet"]
    ports:
      - "127.0.0.1:8980:8980"
      - "127.0.0.1:9980:9980"
    volumes:
      - type: bind
        source: .
        target: /config
        read_only: true
      - type: bind
        source: ${BB_DATA_DIR:-/srv/buildbarn/tiered}
        target: /store
        bind:
          create_host_path: false
      - type: bind
        source: ${BB_HOT_INDEX_DIR:-/srv/pmem-model/bb-hot-index}
        target: /hot-index
        bind:
          create_host_path: false
      - type: bind
        source: /run/z8-cold/cold-layout.json
        target: /cold-layout.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/z8-bb-cache
        target: /run/bb-cache
        bind:
          create_host_path: false
    restart: "no"
