services:
  cache:
    image: ghcr.io/buildbarn/bb-storage:20261102T091443Z-ca3d8b4@sha256:fecab707a842ee1915f2eea06810a1eb2eacc876d498648c67ba32230717f212
    command: ["/config/tiered-cache.jsonnet"]
    ports:
      - "127.0.0.1:8980:8980"
    volumes:
      - type: bind
        source: .
        target: /config
        read_only: true
      - type: bind
        source: ${BB_DATA_DIR:-/srv/buildbarn/tiered}
        target: /store
        bind:
          create_host_path: false
      - type: bind
        source: /data/buildbarn
        target: /cold
        bind:
          create_host_path: false
    restart: "no"
