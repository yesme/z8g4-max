name: Check workstation kit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          bash tests/run.sh
